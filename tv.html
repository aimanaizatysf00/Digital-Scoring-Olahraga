<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paparan Skor TV</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #000; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }

    /* HEADER */
    .header { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 10px 20px; border-radius: 8px; border: 1px solid #333; font-size: 20px; font-weight: bold; }
    .header-info { color: #f1c40f; }

    /* UTAMA: KANAN & KIRI */
    .scoreboard { display: grid; grid-template-columns: 1fr 180px 1fr; gap: 10px; height: calc(100vh - 140px); margin-top: 8px; }
    .side { border-radius: 10px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
    .side.blue { background: #154360; border: 2px solid #2980b9; }
    .side.red { background: #641e16; border: 2px solid #c0392b; }

    .name { font-size: 28px; font-weight: bold; text-transform: uppercase; }
    .team { font-size: 18px; color: #ccc; }
    .score { font-size: 110px; font-weight: bold; text-align: center; margin: auto 0; }

    /* KOTAK HUKUMAN (TERATUR KIRI KE KANAN) */
    .penalties { display: flex; gap: 6px; }
    .p-box { 
      flex: 1; 
      padding: 8px 2px; 
      font-size: 12px; 
      font-weight: bold; 
      text-align: center; 
      border-radius: 4px; 
      background: #000000; /* HITAM BILA BUKAN AKTIF */
      color: #666666; 
      border: 1px solid #333333;
    }

    /* WARNA DINAMIK BILA PENGADIL TEKAN */
    .p-box.active-amaran { background: #f1c40f !important; color: #000 !important; border-color: #f39c12 !important; }
    .p-box.active-teguran { background: #e67e22 !important; color: #fff !important; border-color: #d35400 !important; }
    .p-box.active-peringatan { background: #e74c3c !important; color: #fff !important; border-color: #c0392b !important; }

    /* MASA (TENGAH) */
    .center { background: #111; border-radius: 10px; border: 1px solid #333; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .timer { font-size: 44px; font-weight: bold; font-family: monospace; color: #2ecc71; }
    .timer.paused { color: #e74c3c; }

    /* OVERLAY PENGESAHAN */
    #verifyOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 99; }
    .verify-box { background: #222; border: 3px solid #f1c40f; padding: 30px 50px; border-radius: 15px; font-size: 36px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <div class="header">
    <span class="header-info" id="matchClass">CLASS A</span>
    <span id="roundDisplay">ROUND 1</span>
    <span class="header-info" id="matchNo">MATCH #1</span>
  </div>

  <div class="scoreboard">
    <!-- BIRU -->
    <div class="side blue">
      <div>
        <div class="name" id="blueName">PESILAT BIRU</div>
        <div class="team" id="blueTeam">KONTINJEN BIRU</div>
      </div>
      <div class="score" id="blueScore">0</div>
      <div class="penalties">
        <div class="p-box" id="tv_blue_A1">A1</div>
        <div class="p-box" id="tv_blue_A2">A2</div>
        <div class="p-box" id="tv_blue_T1">T1</div>
        <div class="p-box" id="tv_blue_T2">T2</div>
        <div class="p-box" id="tv_blue_P1">P1</div>
        <div class="p-box" id="tv_blue_P2">P2</div>
      </div>
    </div>

    <!-- MASA -->
    <div class="center">
      <div style="font-size: 14px; color: #888; margin-bottom: 5px;">MASA</div>
      <div class="timer" id="timerDisplay">01:30</div>
    </div>

    <!-- MERAH -->
    <div class="side red">
      <div>
        <div class="name" id="redName">PESILAT MERAH</div>
        <div class="team" id="redTeam">KONTINJEN MERAH</div>
      </div>
      <div class="score" id="redScore">0</div>
      <div class="penalties">
        <div class="p-box" id="tv_red_A1">A1</div>
        <div class="p-box" id="tv_red_A2">A2</div>
        <div class="p-box" id="tv_red_T1">T1</div>
        <div class="p-box" id="tv_red_T2">T2</div>
        <div class="p-box" id="tv_red_P1">P1</div>
        <div class="p-box" id="tv_red_P2">P2</div>
      </div>
    </div>
  </div>

  <div id="verifyOverlay">
    <div class="verify-box" id="verifyText">SAH</div>
  </div>

  <script>
    const socket = io();

    function formatTime(s) {
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    socket.on('updateState', (state) => {
      document.getElementById('blueScore').innerText = state.score.blue;
      document.getElementById('redScore').innerText = state.score.red;
      document.getElementById('roundDisplay').innerText = "ROUND " + state.round;

      const t = document.getElementById('timerDisplay');
      t.innerText = formatTime(state.timer.currentTime);
      if (state.timer.isRunning) t.classList.remove('paused');
      else t.classList.add('paused');

      // TUKAR WARNA KOTAK HUKUMAN DINAMIK
      ['blue', 'red'].forEach(color => {
        setPenClass(color, 'A1', state.penalties[color].A1, 'active-amaran');
        setPenClass(color, 'A2', state.penalties[color].A2, 'active-amaran');
        setPenClass(color, 'T1', state.penalties[color].T1, 'active-teguran');
        setPenClass(color, 'T2', state.penalties[color].T2, 'active-teguran');
        setPenClass(color, 'P1', state.penalties[color].P1, 'active-peringatan');
        setPenClass(color, 'P2', state.penalties[color].P2, 'active-peringatan');
      });

      if(state.matchDetails) {
        document.getElementById('matchClass').innerText = state.matchDetails.className || 'CLASS A';
        document.getElementById('matchNo').innerText = 'MATCH #' + (state.matchDetails.matchNo || '1');
        document.getElementById('blueName').innerText = state.matchDetails.blueName || 'PESILAT BIRU';
        document.getElementById('redName').innerText = state.matchDetails.redName || 'PESILAT MERAH';
        document.getElementById('blueTeam').innerText = state.matchDetails.blueTeam || 'KONTINJEN BIRU';
        document.getElementById('redTeam').innerText = state.matchDetails.redTeam || 'KONTINJEN MERAH';
      }
    });

    function setPenClass(color, code, active, activeClass) {
      const el = document.getElementById(`tv_${color}_${code}`);
      if (el) {
        el.classList.remove('active-amaran', 'active-teguran', 'active-peringatan');
        if (active) el.classList.add(activeClass);
      }
    }

    socket.on('verificationResult', (data) => {
      const overlay = document.getElementById('verifyOverlay');
      document.getElementById('verifyText').innerText = data.text;
      overlay.style.display = 'flex';
      setTimeout(() => { overlay.style.display = 'none'; }, 4000);
    });
  </script>
</body>
</html>
