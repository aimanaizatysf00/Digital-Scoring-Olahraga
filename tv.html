<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paparan SKRIN TV - Silat Olahraga</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Arial Black', Impact, sans-serif; }
    body { background: #050505; color: #fff; margin: 0; padding: 20px; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }

    .header { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 15px 30px; border-radius: 12px; border: 2px solid #333; }
    .header-title { font-size: 2rem; color: #f1c40f; letter-spacing: 2px; }
    .header-info { font-size: 1.5rem; color: #fff; }

    .arena { display: grid; grid-template-columns: 1fr 280px 1fr; gap: 20px; align-items: center; margin: 20px 0; flex: 1; }

    .corner { border-radius: 20px; padding: 20px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
    .blue-corner { background: linear-gradient(135deg, #003366, #0066cc); border: 4px solid #0099ff; }
    .red-corner { background: linear-gradient(135deg, #660000, #cc0000); border: 4px solid #ff3333; }

    .fighter-name { font-size: 2.8rem; text-transform: uppercase; line-height: 1.1; text-shadow: 2px 2px 4px #000; }
    .team-name { font-size: 1.6rem; color: #ddd; font-family: sans-serif; margin-top: 5px; }

    .score { font-size: 10rem; text-align: center; font-weight: bold; text-shadow: 4px 4px 10px #000; }

    .penalties-container { display: flex; gap: 10px; justify-content: center; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; }
    .pen-icon { font-size: 1.8rem; opacity: 0.2; transition: 0.3s; }
    .pen-icon.active { opacity: 1; filter: drop-shadow(0 0 8px #fff); }

    .center-box { text-align: center; background: #111; border: 3px solid #333; border-radius: 20px; padding: 20px; height: 100%; display: flex; flex-direction: column; justify-content: center; }
    .round-title { font-size: 2.2rem; color: #f1c40f; margin-bottom: 10px; }
    .timer { font-size: 5rem; font-family: monospace; color: #2ecc71; background: #000; padding: 10px; border-radius: 10px; border: 2px solid #2ecc71; }

    .tv-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .winner-box { border: 6px solid #f1c40f; padding: 40px; border-radius: 25px; background: #111; width: 80%; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title" id="tvClass">CLASS A</div>
    <div class="header-info">MATCH NO: <span id="tvMatchNo" style="color: #f1c40f;">1</span></div>
  </div>

  <div class="arena">
    <!-- BIRU -->
    <div class="corner blue-corner">
      <div>
        <div class="fighter-name" id="tvBlueName">PESILAT BIRU</div>
        <div class="team-name" id="tvBlueTeam">KONTINJEN BIRU</div>
      </div>
      <div class="score" id="tvBlueScore">0</div>
      <div class="penalties-container">
        <span class="pen-icon" id="tv_blue_A1">👈</span>
        <span class="pen-icon" id="tv_blue_A2">👈✌️</span>
        <span class="pen-icon" id="tv_blue_T1">☝️</span>
        <span class="pen-icon" id="tv_blue_T2">✌️</span>
        <span class="pen-icon" id="tv_blue_P1">🙅‍♂️</span>
        <span class="pen-icon" id="tv_blue_P2">🙅‍♂️🙅‍♂️</span>
      </div>
    </div>

    <!-- CENTER -->
    <div class="center-box">
      <div class="round-title" id="tvRound">ROUND 1</div>
      <div class="timer" id="tvTimer">01:30</div>
    </div>

    <!-- MERAH -->
    <div class="corner red-corner">
      <div>
        <div class="fighter-name" id="tvRedName">PESILAT MERAH</div>
        <div class="team-name" id="tvRedTeam">KONTINJEN MERAH</div>
      </div>
      <div class="score" id="tvRedScore">0</div>
      <div class="penalties-container">
        <span class="pen-icon" id="tv_red_A1">👈</span>
        <span class="pen-icon" id="tv_red_A2">👈✌️</span>
        <span class="pen-icon" id="tv_red_T1">☝️</span>
        <span class="pen-icon" id="tv_red_T2">✌️</span>
        <span class="pen-icon" id="tv_red_P1">🙅‍♂️</span>
        <span class="pen-icon" id="tv_red_P2">🙅‍♂️🙅‍♂️</span>
      </div>
    </div>
  </div>

  <div class="tv-overlay" id="winnerOverlay">
    <div class="winner-box">
      <h1 style="font-size: 3.5rem; color: #f1c40f; margin: 0;">🏆 PEMENANG RASMI 🏆</h1>
      <h2 id="wName" style="font-size: 4rem; margin: 20px 0; text-transform: uppercase;">-</h2>
      <h3 id="wTeam" style="font-size: 2.5rem; color: #aaa; margin: 0;">-</h3>
      <p id="wReason" style="font-size: 1.8rem; color: #2ecc71; margin-top: 30px; font-family: sans-serif;"></p>
    </div>
  </div>

  <script>
    const socket = io();

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    socket.on('updateState', (state) => {
      if (!state) return;

      document.getElementById('tvClass').innerText = state.matchDetails.className;
      document.getElementById('tvMatchNo').innerText = state.matchDetails.matchNo;
      document.getElementById('tvBlueName').innerText = state.matchDetails.blueName;
      document.getElementById('tvBlueTeam').innerText = state.matchDetails.blueTeam;
      document.getElementById('tvRedName').innerText = state.matchDetails.redName;
      document.getElementById('tvRedTeam').innerText = state.matchDetails.redTeam;

      document.getElementById('tvTimer').innerText = formatTime(state.timer.currentTime);
      document.getElementById('tvRound').innerText = `ROUND ${state.round}`;

      document.getElementById('tvBlueScore').innerText = state.score.blue;
      document.getElementById('tvRedScore').innerText = state.score.red;

      ['blue', 'red'].forEach(color => {
        ['A1', 'A2', 'T1', 'T2', 'P1', 'P2'].forEach(code => {
          const elem = document.getElementById(`tv_${color}_${code}`);
          if (elem && state.penalties && state.penalties[color]) {
            if (state.penalties[color][code]) elem.classList.add('active');
            else elem.classList.remove('active');
          }
        });
      });

      if (state.winnerData) {
        showWinnerOverlay(state);
      } else {
        document.getElementById('winnerOverlay').style.display = 'none';
      }
    });

    function showWinnerOverlay(state) {
      const overlay = document.getElementById('winnerOverlay');
      const data = state.winnerData;

      if (data.winner === 'blue') {
        document.getElementById('wName').innerText = state.matchDetails.blueName;
        document.getElementById('wName').style.color = '#3498db';
        document.getElementById('wTeam').innerText = state.matchDetails.blueTeam;
      } else if (data.winner === 'red') {
        document.getElementById('wName').innerText = state.matchDetails.redName;
        document.getElementById('wName').style.color = '#e74c3c';
        document.getElementById('wTeam').innerText = state.matchDetails.redTeam;
      } else {
        document.getElementById('wName').innerText = 'SERI (DRAW)';
        document.getElementById('wName').style.color = '#f1c40f';
        document.getElementById('wTeam').innerText = '-';
      }

      document.getElementById('wReason').innerText = data.reason;
      overlay.style.display = 'flex';
    }
  </script>
</body>
</html>
