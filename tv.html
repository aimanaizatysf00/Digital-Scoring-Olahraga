<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard TV Silat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Arial', sans-serif; }
    body { background: #000; color: white; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }

    /* HEADER NAMA PESERTA */
    .names-header { display: flex; gap: 10px; height: 10vh; margin-bottom: 5px; }
    .name-box { flex: 1; padding: 10px 15px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; font-weight: bold; text-transform: uppercase; }
    .blue-name { background: #0080ff; color: #fff; }
    .red-name { background: #d32f2f; color: #fff; text-align: right; }
    .p-name { font-size: 1.8vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-team { font-size: 1.1vw; opacity: 0.9; }

    /* 3 KOTAK HEADER TEMPAT MASA/MATCH/ROUND */
    .info-bar { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 10px; height: 10vh; margin-bottom: 10px; }
    .info-card { background: #1a252f; border: 2px solid #34495e; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: 900; color: #fff; text-transform: uppercase; }
    .match-info { font-size: 2vw; color: #3498db; }
    .timer-info { font-size: 3.5vw; color: #2ecc71; font-family: monospace; background: #000; border-color: #27ae60; }
    .timer-info.paused { color: #e74c3c; border-color: #c0392b; }
    .round-info { font-size: 2.2vw; color: #f1c40f; }

    /* MAIN BOARD AREA */
    .main-board { display: flex; gap: 10px; height: 75vh; }
    .corner-side { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    
    .score-and-penalties { flex: 1; display: flex; gap: 5px; }
    
    /* SKOR BOX */
    .score-box { flex: 1.2; background: #111; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 17vw; font-weight: 900; line-height: 1; border: 4px solid #333; }
    .blue-score { color: #3498db; background: #001f3f; border-color: #0080ff; }
    .red-score { color: #e74c3c; background: #3d0000; border-color: #d32f2f; }

    /* GRID SIMBOL HUKUMAN */
    .penalties-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 5px; }
    
    .p-icon-box { 
      background: #111; 
      color: #555; 
      border-radius: 6px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 2vw; 
      font-weight: bold; 
      border: 2px solid #333; 
      transition: all 0.2s; 
    }
    
    /* WARNA DINAMIK APABILA DITEKAN PENGADIL (AKTIF) */
    .p-icon-box.active-amaran { 
      background: #f1c40f !important; /* KUNING */
      color: #000 !important; 
      border-color: #fff !important; 
      box-shadow: 0 0 15px rgba(241, 196, 15, 0.9); 
      transform: scale(1.02); 
    }

    .p-icon-box.active-teguran { 
      background: #e67e22 !important; /* OREN */
      color: #fff !important; 
      border-color: #fff !important; 
      box-shadow: 0 0 15px rgba(230, 126, 34, 0.9); 
      transform: scale(1.02); 
    }

    .p-icon-box.active-peringatan { 
      background: #c0392b !important; /* MERAH */
      color: #fff !important; 
      border-color: #fff !important; 
      box-shadow: 0 0 15px rgba(192, 57, 43, 0.9); 
      transform: scale(1.02); 
    }

    /* INDIKATOR JURI (3 KOTAK BAWAH SKOR) */
    .juri-indicators { display: flex; gap: 5px; height: 5vh; }
    .juri-box { 
      flex: 1; 
      background: #222; 
      border: 2px solid #444; 
      border-radius: 6px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 1vw; 
      font-weight: bold; 
      color: #555; 
      transition: all 0.15s ease;
    }

    /* KESAN LAMPU MENYALA APABILA JURI TEKAN BUTTON */
    .juri-indicators #blue_juri_1.active,
    .juri-indicators #blue_juri_2.active,
    .juri-indicators #blue_juri_3.active { 
      background: #0080ff !important; 
      color: #fff !important; 
      border-color: #ffffff !important; 
      box-shadow: 0 0 20px #0080ff; 
      transform: scale(1.05);
    }

    .juri-indicators #red_juri_1.active,
    .juri-indicators #red_juri_2.active,
    .juri-indicators #red_juri_3.active { 
      background: #d32f2f !important; 
      color: #fff !important; 
      border-color: #ffffff !important; 
      box-shadow: 0 0 20px #d32f2f; 
      transform: scale(1.05);
    }

    /* POPUP VERIFICATION & DISQUALIFIED */
    #tvOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 999; flex-direction: column; justify-content: center; align-items: center; border: 10px solid #f1c40f; }
    .overlay-title { font-size: 3vw; font-weight: 900; color: #f1c40f; }
    .overlay-detail { font-size: 5vw; font-weight: bold; margin: 20px 0; }
    .overlay-result { font-size: 4vw; font-weight: 900; padding: 15px 30px; border-radius: 15px; }
    .result-sah { background: #2ecc71; color: white; }
    .result-xsah { background: #e74c3c; color: white; }
    .result-pending { background: #f39c12; color: black; }
  </style>
</head>
<body>

  <!-- HEADER NAMA PESERTA -->
  <div class="names-header">
    <div class="name-box blue-name">
      <div class="p-name" id="blueNameDisplay">PESILAT BIRU</div>
      <div class="p-team" id="blueTeamDisplay">KONTINJEN BIRU</div>
    </div>
    <div class="name-box red-name">
      <div class="p-name" id="redNameDisplay">PESILAT MERAH</div>
      <div class="p-team" id="redTeamDisplay">KONTINJEN MERAH</div>
    </div>
  </div>

  <!-- 3 KOTAK INFO (CLASS/MATCH, TIMER, ROUND) -->
  <div class="info-bar">
    <div class="info-card match-info" id="matchClassDisplay">CLASS A | MATCH 1</div>
    <div class="info-card timer-info" id="timerDisplay">01:30</div>
    <div class="info-card round-info" id="roundDisplay">ROUND 1</div>
  </div>

  <!-- MAIN BOARD -->
  <div class="main-board">
    
    <!-- SUDUT BIRU -->
    <div class="corner-side">
      <div class="score-and-penalties">
        <!-- ISYARAT HUKUMAN BIRU -->
        <div class="penalties-grid">
          <div class="p-icon-box" id="blue_A1" title="Amaran 1">👈</div>
          <div class="p-icon-box" id="blue_A2" title="Amaran 2">👈✌️</div>
          <div class="p-icon-box" id="blue_T1" title="Teguran 1 (-1)">☝️</div>
          <div class="p-icon-box" id="blue_T2" title="Teguran 2 (-2)">✌️</div>
          <div class="p-icon-box" id="blue_P1" title="Peringatan 1 (-5)">🙅‍♂️</div>
          <div class="p-icon-box" id="blue_P2" title="Peringatan 2 (-10)">🙅‍♂️🙅‍♂️</div>
        </div>
        <!-- SKOR BIRU -->
        <div class="score-box blue-score" id="blueScore">0</div>
      </div>
      <!-- 3 KOTAK JURI BIRU -->
      <div class="juri-indicators">
        <div class="juri-box" id="blue_juri_1">JURI 1</div>
        <div class="juri-box" id="blue_juri_2">JURI 2</div>
        <div class="juri-box" id="blue_juri_3">JURI 3</div>
      </div>
    </div>

    <!-- SUDUT MERAH -->
    <div class="corner-side">
      <div class="score-and-penalties">
        <!-- SKOR MERAH -->
        <div class="score-box red-score" id="redScore">0</div>
        <!-- ISYARAT HUKUMAN MERAH -->
        <div class="penalties-grid">
          <div class="p-icon-box" id="red_A1" title="Amaran 1">👈</div>
          <div class="p-icon-box" id="red_A2" title="Amaran 2">👈✌️</div>
          <div class="p-icon-box" id="red_T1" title="Teguran 1 (-1)">☝️</div>
          <div class="p-icon-box" id="red_T2" title="Teguran 2 (-2)">✌️</div>
          <div class="p-icon-box" id="red_P1" title="Peringatan 1 (-5)">🙅‍♂️</div>
          <div class="p-icon-box" id="red_P2" title="Peringatan 2 (-10)">🙅‍♂️🙅‍♂️</div>
        </div>
      </div>
      <!-- 3 KOTAK JURI MERAH -->
      <div class="juri-indicators">
        <div class="juri-box" id="red_juri_1">JURI 1</div>
        <div class="juri-box" id="red_juri_2">JURI 2</div>
        <div class="juri-box" id="red_juri_3">JURI 3</div>
      </div>
    </div>

  </div>

  <!-- POPUP VERIFICATION -->
  <div id="tvOverlay">
    <div class="overlay-title" id="tvVerifyTitle">⚠️ SEMAKAN PENGESAHAN JURI ⚠️</div>
    <div class="overlay-detail" id="tvVerifyDetail">JATUHAN - SUDUT BIRU</div>
    <div class="overlay-result result-pending" id="tvVerifyResult">MENUNGGU 3 JURI...</div>
  </div>

  <script>
    const socket = io();

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    socket.on('updateState', (state) => {
      // Update Nama & Match Info
      if(state.matchInfo) {
        document.getElementById('blueNameDisplay').innerText = state.matchInfo.blueName || 'PESILAT BIRU';
        document.getElementById('blueTeamDisplay').innerText = state.matchInfo.blueTeam || 'KONTINJEN BIRU';
        document.getElementById('redNameDisplay').innerText = state.matchInfo.redName || 'PESILAT MERAH';
        document.getElementById('redTeamDisplay').innerText = state.matchInfo.redTeam || 'KONTINJEN MERAH';
        document.getElementById('matchClassDisplay').innerText = `${state.matchInfo.className || 'CLASS A'} | MATCH ${state.matchInfo.matchNo || '1'}`;
      }

      // Update Skor & Round
      document.getElementById('blueScore').innerText = state.score.blue;
      document.getElementById('redScore').innerText = state.score.red;
      document.getElementById('roundDisplay').innerText = "ROUND " + state.round;

      // Update Masa
      const timerElem = document.getElementById('timerDisplay');
      timerElem.innerText = formatTime(state.timer.currentTime);
      if (state.timer.isRunning) timerElem.classList.remove('paused');
      else timerElem.classList.add('paused');

      // Update Lampu Penalti mengikut warna khusus
      const penConfig = [
        { code: 'A1', type: 'active-amaran' },
        { code: 'A2', type: 'active-amaran' },
        { code: 'T1', type: 'active-teguran' },
        { code: 'T2', type: 'active-teguran' },
        { code: 'P1', type: 'active-peringatan' },
        { code: 'P2', type: 'active-peringatan' }
      ];

      ['blue', 'red'].forEach(color => {
        penConfig.forEach(p => {
          const elem = document.getElementById(`${color}_${p.code}`);
          if (elem) {
            elem.classList.remove('active-amaran', 'active-teguran', 'active-peringatan');
            if (state.penalties && state.penalties[color] && state.penalties[color][p.code]) {
              elem.classList.add(p.type);
            }
          }
        });
      });
    });

   // MENYALAKAN LAMPU INDIKATOR JURI & PAPAR SIMBOL SERANGAN
    socket.on('juriPressSignal', (data) => {
      const targetId = data.elementId || `${data.color}_juri_${data.juriId}`;
      const lampElement = document.getElementById(targetId);

      if (lampElement) {
        // Tentukan simbol & warna teks mengikut jenis markah (1 = Pukulan, 2 = Tendangan)
        let symbol = '';
        if (Number(data.points) === 1) {
          symbol = '🥊 +1'; // Simbol Pukulan
        } else if (Number(data.points) === 2) {
          symbol = '🦶 +2'; // Simbol Tendangan
        } else {
          symbol = `+${data.points}`;
        }

        // Simpan nama asal (contoh: "JURI 1")
        const originalText = `JURI ${data.juriId}`;

        // Tukar teks kotak kepada simbol serangan & nyalakan lampu
        lampElement.innerText = symbol;
        lampElement.classList.add('active');

        // Selepas 1.2 saat, kembalikan semula kepada teks "JURI X" & padamkan lampu
        setTimeout(() => {
          lampElement.innerText = originalText;
          lampElement.classList.remove('active');
        }, 1200);
      }
    });

    socket.on('promptVerification', (data) => {
      document.getElementById('tvVerifyTitle').innerText = "⚠️ SEMAKAN PENGESAHAN JURI ⚠️";
      document.getElementById('tvVerifyDetail').innerText = data.type + ' - SUDUT ' + data.color.toUpperCase();
      document.getElementById('tvVerifyResult').innerText = "MENUNGGU 3 JURI...";
      document.getElementById('tvVerifyResult').className = "overlay-result result-pending";
      document.getElementById('tvOverlay').style.display = 'flex';
    });

    socket.on('verificationResult', (data) => {
      const resElem = document.getElementById('tvVerifyResult');
      resElem.innerText = data.text;
      resElem.className = "overlay-result " + (data.isApproved ? "result-sah" : "result-xsah");
      setTimeout(() => { document.getElementById('tvOverlay').style.display = 'none'; }, 4000);
    });

    socket.on('disqualifiedAlert', (color) => {
      document.getElementById('tvVerifyTitle').innerText = "❌ DISQUALIFIED / BATAL ❌";
      document.getElementById('tvVerifyDetail').innerText = "SUDUT " + color.toUpperCase() + " DIBATALKAN!";
      document.getElementById('tvVerifyResult').innerText = "PESILAT BATAL (6 AMARAN)";
      document.getElementById('tvVerifyResult').className = "overlay-result result-xsah";
      document.getElementById('tvOverlay').style.display = 'flex';
      setTimeout(() => { document.getElementById('tvOverlay').style.display = 'none'; }, 6000);
    });
  </script>
</body>
</html>
