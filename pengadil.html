<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Pengadil - Sistem Silat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #121212; color: #ffffff; margin: 0; padding: 15px; }

    h1, h2, h3, h4 { margin: 5px 0; text-align: center; }
    .header-title { color: #f1c40f; text-transform: uppercase; margin-bottom: 15px; }

    /* LAYOUT UTAMA */
    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .full-width { grid-column: span 2; }

    .card { background: #1e1e1e; border-radius: 10px; padding: 15px; border: 1px solid #333; }

    /* KAWALAN MASA & ROUND */
    .timer-card { text-align: center; background: #0d1117; border: 2px solid #30363d; }
    .timer-display { font-size: 3.5rem; font-family: monospace; font-weight: bold; color: #2ecc71; margin: 10px 0; }
    .timer-display.paused { color: #e67e22; }

    .btn { padding: 12px 20px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
    .btn:active { transform: scale(0.96); }

    .btn-success { background: #2ecc71; color: #fff; }
    .btn-warning { background: #f39c12; color: #fff; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-info { background: #3498db; color: #fff; }
    .btn-dark { background: #34495e; color: #fff; }

    .controls-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

    /* INFO PERLAWANAN FORM */
    .form-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
    .form-group input { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 5px; font-size: 0.9rem; }

    /* KAWALAN SUDUT BIRU & MERAH */
    .corner-title { font-size: 1.4rem; padding: 8px; border-radius: 6px; margin-bottom: 10px; text-align: center; font-weight: bold; }
    .blue-corner { border: 2px solid #0080ff; }
    .blue-title { background: #0080ff; color: #fff; }
    .red-corner { border: 2px solid #d32f2f; }
    .red-title { background: #d32f2f; color: #fff; }

    .score-display-box { font-size: 3rem; font-weight: bold; text-align: center; margin: 10px 0; }

    /* BUTANG PENALTI & MODIFIKASI */
    .penalty-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
    .btn-penalty { background: #2c3e50; color: #fff; border: 1px solid #455a64; padding: 10px; font-size: 0.85rem; border-radius: 5px; cursor: pointer; }
    .btn-penalty.active { background: #e74c3c; color: #fff; border-color: #fff; box-shadow: 0 0 10px #e74c3c; }

    /* LOG PERLAWANAN */
    .log-box { background: #0a0a0a; color: #00ffcc; font-family: monospace; height: 160px; overflow-y: auto; padding: 10px; border-radius: 6px; border: 1px solid #333; font-size: 0.85rem; }
    .log-box p { margin: 3px 0; border-bottom: 1px solid #1a1a1a; padding-bottom: 2px; }

    /* POPUP OVERLAY VERIFICATION */
    #verifyOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; }
    .verify-card { background: #1e1e1e; padding: 25px; border-radius: 12px; border: 3px solid #f1c40f; text-align: center; max-width: 400px; width: 90%; }
  </style>
</head>
<body>

  <h2 class="header-title">📋 PANEL KAWALAN PENGADIL / KETUA PERTANDINGAN</h2>

  <div class="container">
    
    <!-- KAWALAN MASA & ROUND (SPAN 2) -->
    <div class="card timer-card full-width">
      <h3>PUSINGAN & PEMASA</h3>
      <div class="timer-display paused" id="timerDisplay">01:30</div>
      
      <div class="controls-row">
        <button class="btn btn-success" onclick="controlTimer('start')">▶️ MULA (START)</button>
        <button class="btn btn-warning" onclick="controlTimer('pause')">⏸️ HENTI (PAUSE)</button>
        <button class="btn btn-dark" onclick="setTimerDuration(90)">01:30</button>
        <button class="btn btn-dark" onclick="setTimerDuration(120)">02:00</button>
      </div>

      <div class="controls-row" style="margin-top: 15px;">
        <button class="btn btn-info" onclick="setRound(1)">ROUND 1</button>
        <button class="btn btn-info" onclick="setRound(2)">ROUND 2</button>
        <button class="btn btn-info" onclick="setRound(3)">ROUND 3</button>
      </div>
    </div>

    <!-- MAKLUMAT PESERTA & MATCH (SPAN 2) -->
    <div class="card full-width">
      <h4>MAKLUMAT PERLAWANAN</h4>
      <div class="form-group">
        <input type="text" id="className" placeholder="Kelas (cth: CLASS A)" value="CLASS A">
        <input type="text" id="matchNo" placeholder="No. Match (cth: 1)" value="1">
        <button class="btn btn-info" onclick="updateMatchDetails()">KEMASKINI INFO</button>
      </div>
      <div class="form-group">
        <input type="text" id="blueName" placeholder="Nama Pesilat Biru" value="PESILAT BIRU">
        <input type="text" id="blueTeam" placeholder="Kontinjen Biru" value="KONTINJEN BIRU">
        <div></div>
      </div>
      <div class="form-group">
        <input type="text" id="redName" placeholder="Nama Pesilat Merah" value="PESILAT MERAH">
        <input type="text" id="redTeam" placeholder="Kontinjen Merah" value="KONTINJEN MERAH">
        <div></div>
      </div>
    </div>

    <!-- KAWALAN SUDUT BIRU -->
    <div class="card blue-corner">
      <div class="corner-title blue-title">SUDUT BIRU</div>
      <div class="score-display-box" id="blueScore">0</div>

      <h4>HUKUMAN (PENALTI)</h4>
      <div class="penalty-grid">
        <button class="btn-penalty" id="btn_blue_A1" onclick="togglePenalty('blue', 'A1', 0)">Amaran 1 (A1)</button>
        <button class="btn-penalty" id="btn_blue_A2" onclick="togglePenalty('blue', 'A2', 0)">Amaran 2 (A2)</button>
        <button class="btn-penalty" id="btn_blue_T1" onclick="togglePenalty('blue', 'T1', -1)">Teguran 1 (-1)</button>
        <button class="btn-penalty" id="btn_blue_T2" onclick="togglePenalty('blue', 'T2', -2)">Teguran 2 (-2)</button>
        <button class="btn-penalty" id="btn_blue_P1" onclick="togglePenalty('blue', 'P1', -5)">Peringatan 1 (-5)</button>
        <button class="btn-penalty" id="btn_blue_P2" onclick="togglePenalty('blue', 'P2', -10)">Peringatan 2 (-10)</button>
      </div>

      <h4>PELARASAN MARKAH MANUAL</h4>
      <div class="controls-row">
        <button class="btn btn-info" onclick="modifyScore('blue', 1)">+1</button>
        <button class="btn btn-info" onclick="modifyScore('blue', 2)">+2</button>
        <button class="btn btn-danger" onclick="modifyScore('blue', -1)">-1</button>
        <button class="btn btn-danger" onclick="modifyScore('blue', -2)">-2</button>
      </div>

      <div style="margin-top: 15px; text-align: center;">
        <button class="btn btn-warning" onclick="requestVerification('AMARAN', 'blue')">Minta Pengesahan Amaran</button>
      </div>
    </div>

    <!-- KAWALAN SUDUT MERAH -->
    <div class="card red-corner">
      <div class="corner-title red-title">SUDUT MERAH</div>
      <div class="score-display-box" id="redScore">0</div>

      <h4>HUKUMAN (PENALTI)</h4>
      <div class="penalty-grid">
        <button class="btn-penalty" id="btn_red_A1" onclick="togglePenalty('red', 'A1', 0)">Amaran 1 (A1)</button>
        <button class="btn-penalty" id="btn_red_A2" onclick="togglePenalty('red', 'A2', 0)">Amaran 2 (A2)</button>
        <button class="btn-penalty" id="btn_red_T1" onclick="togglePenalty('red', 'T1', -1)">Teguran 1 (-1)</button>
        <button class="btn-penalty" id="btn_red_T2" onclick="togglePenalty('red', 'T2', -2)">Teguran 2 (-2)</button>
        <button class="btn-penalty" id="btn_red_P1" onclick="togglePenalty('red', 'P1', -5)">Peringatan 1 (-5)</button>
        <button class="btn-penalty" id="btn_red_P2" onclick="togglePenalty('red', 'P2', -10)">Peringatan 2 (-10)</button>
      </div>

      <h4>PELARASAN MARKAH MANUAL</h4>
      <div class="controls-row">
        <button class="btn btn-info" onclick="modifyScore('red', 1)">+1</button>
        <button class="btn btn-info" onclick="modifyScore('red', 2)">+2</button>
        <button class="btn btn-danger" onclick="modifyScore('red', -1)">-1</button>
        <button class="btn btn-danger" onclick="modifyScore('red', -2)">-2</button>
      </div>

      <div style="margin-top: 15px; text-align: center;">
        <button class="btn btn-warning" onclick="requestVerification('AMARAN', 'red')">Minta Pengesahan Amaran</button>
      </div>
    </div>

    <!-- LOG PERLAWANAN & BUTANG KAWALAN UTAMA (SPAN 2) -->
    <div class="card full-width">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h4 style="margin: 0;">📜 REKOD LOG PERLAWANAN</h4>
        <button class="btn btn-dark" onclick="downloadLog()" style="font-size: 0.8rem; padding: 6px 12px;">📥 MUAT TURUN LOG (.TXT)</button>
      </div>
      <div class="log-box" id="logList"></div>

      <div class="controls-row" style="margin-top: 20px;">
        <button class="btn btn-success" style="font-size: 1.1rem; padding: 15px 30px;" onclick="publishWinner()">🏆 PAPAR PEMENANG DI SKRIN TV</button>
        <button class="btn btn-danger" onclick="resetAll()">🔄 RESET KESELURUHAN</button>
      </div>
    </div>

  </div>

  <script>
    const socket = io();
    let currentLogs = [];

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // UPDATE DARI SERVER
    socket.on('updateState', (state) => {
      if (!state) return;

      // Update Masa
      const timerElem = document.getElementById('timerDisplay');
      timerElem.innerText = formatTime(state.timer.currentTime);
      if (state.timer.isRunning) timerElem.classList.remove('paused');
      else timerElem.classList.add('paused');

      // Update Markah
      document.getElementById('blueScore').innerText = state.score.blue;
      document.getElementById('redScore').innerText = state.score.red;

      // Update Status Butang Penalti
      const penaltyCodes = ['A1', 'A2', 'T1', 'T2', 'P1', 'P2'];
      ['blue', 'red'].forEach(color => {
        penaltyCodes.forEach(code => {
          const btn = document.getElementById(`btn_${color}_${code}`);
          if (btn && state.penalties && state.penalties[color]) {
            if (state.penalties[color][code]) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          }
        });
      });
    });

    // MASUKKAN LOG BAHARU
    socket.on('newLog', (logText) => {
      currentLogs.unshift(logText);
      const logList = document.getElementById('logList');
      if (logList) {
        const p = document.createElement('p');
        p.innerText = logText;
        logList.insertBefore(p, logList.firstChild);
      }
    });

    // FUNGSI KAWALAN PENGADIL
    function controlTimer(action) {
      socket.emit('controlTimer', action);
    }

    function setTimerDuration(seconds) {
      socket.emit('setTimerDuration', seconds);
    }

    function setRound(roundNum) {
      socket.emit('setRound', roundNum);
    }

    function updateMatchDetails() {
      const data = {
        className: document.getElementById('className').value,
        matchNo: document.getElementById('matchNo').value,
        blueName: document.getElementById('blueName').value,
        blueTeam: document.getElementById('blueTeam').value,
        redName: document.getElementById('redName').value,
        redTeam: document.getElementById('redTeam').value
      };
      socket.emit('updateMatchDetails', data);
      alert('Info Perlawanan Dikemaskini!');
    }

    function togglePenalty(color, code, pts) {
      socket.emit('togglePenalty', { color, code, pts });
    }

    function modifyScore(color, pts) {
      socket.emit('modifyScore', { color, pts });
    }

    function requestVerification(type, color) {
      socket.emit('requestVerification', { type, color });
      alert(`Mengarahkan Juri membuat semakan pengesahan ${type} untuk ${color.toUpperCase()}`);
    }

    function publishWinner() {
      if (confirm('Adakah anda pasti untuk mengumumkan pemenang ke TV?')) {
        socket.emit('publishWinnerToTV');
      }
    }

    function resetAll() {
      if (confirm('AMARAN: Anda pasti untuk reset keseluruhan skoring dan log?')) {
        socket.emit('resetScore');
        document.getElementById('logList').innerHTML = '';
        currentLogs = [];
      }
    }

    // FUNGSI MUAT TURUN FAIL LOG (.TXT)
    function downloadLog() {
      if (currentLogs.length === 0) {
        alert('Tiada rekod log untuk dimuat turun!');
        return;
      }
      
      const logContent = "=== REKOD LOG PERLAWANAN SILAT ===\n\n" + currentLogs.slice().reverse().join('\n');
      const blob = new Blob([logContent], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      
      const matchNo = document.getElementById('matchNo').value || '1';
      a.download = `Log_Perlawanan_Match_${matchNo}.txt`;
      
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
