<!DOCTYPE1 html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KONTROL PENGADIL - SILAT OLAHRAGA</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --red-corner: #dc3545;
      --red-hover: #bb2d3b;
      --blue-corner: #0d6efd;
      --blue-hover: #0b5ed7;
      --gold-accent: #ffc107;
      --text-light: #ffffff;
      --gray-btn: #495057;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* HEADER */
    .header {
      background: #000;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
    }
    .header h2 {
      font-size: 1.2rem;
      color: var(--gold-accent);
      letter-spacing: 1px;
    }

    /* CONTAINER UTAMA */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 50px);
    }

    /* BAHAGIAN KIRI: KONTROL PEMASA & PUSINGAN */
    .center-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      background-color: var(--card-bg);
      border-right: 2px solid #333;
    }

    .round-display {
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      color: var(--gold-accent);
      background: #000;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
    }

    .timer-display {
      font-size: 4.5rem;
      font-weight: bold;
      font-family: monospace;
      text-align: center;
      color: #00ffcc;
      background: #000;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #00ffcc;
      text-shadow: 0 0 10px rgba(0,255,204,0.3);
      margin: 10px 0;
    }
    .timer-display.paused {
      color: #ff3333;
      border-color: #ff3333;
      text-shadow: 0 0 10px rgba(255,51,51,0.3);
    }

    .timer-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .round-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    /* BAHAGIAN KANAN: HUKUMAN (SUDUT MERAH & BIRU) */
    .penalty-panel {
      flex: 2;
      display: flex;
      gap: 10px;
      padding: 15px;
    }

    .corner-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #181818;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
    }

    .corner-header {
      padding: 10px;
      font-size: 1.3rem;
      font-weight: bold;
      text-align: center;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .red-header { background-color: var(--red-corner); color: white; }
    .blue-header { background-color: var(--blue-corner); color: white; }

    .penalty-group {
      background: #252525;
      padding: 8px;
      border-radius: 6px;
    }
    .penalty-title {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    /* ASAS BUTANG */
    .btn {
      border: none;
      color: white;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s, transform 0.05s;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .btn:active {
      transform: scale(0.96);
    }

    .btn-start { background-color: #198754; font-size: 1.2rem; }
    .btn-pause { background-color: #ffc107; color: #000; font-size: 1.2rem; }
    .btn-reset { background-color: #dc3545; grid-column: span 2; }
    .btn-round { background-color: var(--gray-btn); }
    .btn-round.active { background-color: var(--gold-accent); color: #000; }

    .btn-teguran { background-color: #fd7e14; }
    .btn-peringatan { background-color: #d63384; }
    .btn-penalti { background-color: #dc3545; }
    .btn-undo { background-color: #6c757d; grid-column: span 2; margin-top: 5px; font-size: 0.8rem;}

    /* HAMBARAN OVERLAY DIBEKUKAN */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      flex-direction: column;
    }
    .overlay-text {
      font-size: 2.5rem;
      color: #ff3333;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255,0,0,0.5);
    }

    /* TINGKAH LAKU POPUP MODAL */
    .modal-content {
      background: #222;
      padding: 25px;
      border-radius: 12px;
      border: 2px solid var(--gold-accent);
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .modal-title {
      font-size: 1.5rem;
      color: var(--gold-accent);
      margin-bottom: 15px;
      font-weight: bold;
    }
    .modal-body {
      font-size: 1.1rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* RESPONSIVE UNTUK SKRIN PERANTI BIMBIT/TABLET */
    @media (max-width: 768px) {
      .main-container { flex-direction: column; overflow-y: auto; }
      .center-panel { border-right: none; border-bottom: 2px solid #333; }
      .penalty-panel { flex-direction: column; }
      .timer-display { font-size: 3.5rem; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>📋 PANEL PENGADIL (REFEREE)</h2>
    <span id="connectionStatus" style="color: #28a745; font-size: 0.85rem; font-weight: bold;">● BERSAMBUNG</span>
  </div>

  <div class="main-container">
    
    <!-- BAHAGIAN KIRI: MASA & PUSINGAN -->
    <div class="center-panel">
      <div>
        <div class="round-display" id="roundDisplay">PUSINGAN 1</div>
        <div class="timer-display paused" id="timerDisplay">02:00</div>
        
        <div class="timer-controls">
          <button class="btn btn-start" onclick="controlTimer('start')">▶ MULA</button>
          <button class="btn btn-pause" onclick="controlTimer('pause')">⏸ JEDA</button>
          <button class="btn btn-reset" onclick="controlTimer('reset')">🔄 TETAP SEMULA MASA</button>
        </div>
      </div>

      <div>
        <div class="penalty-title" style="text-align: center; margin-top: 15px;">TUKAR PUSINGAN</div>
        <div class="round-controls">
          <button class="btn btn-round active" id="btnR1" onclick="setRound(1)">P1</button>
          <button class="btn btn-round" id="btnR2" onclick="setRound(2)">P2</button>
          <button class="btn btn-round" id="btnR3" onclick="setRound(3)">P3</button>
        </div>
        <button class="btn btn-reset" style="width:100%; margin-top:10px; background:#444;" onclick="resetMatchModal()">⚠️ TETAP SEMULA PERLAWANAN</button>
      </div>
    </div>

    <!-- BAHAGIAN KANAN: HUKUMAN & TINDAKAN -->
    <div class="penalty-panel">
      
      <!-- SUDUT MERAH -->
      <div class="corner-box">
        <div class="corner-header red-header">SUDUT MERAH</div>
        
        <div class="penalty-group">
          <div class="penalty-title">TEGURAN</div>
          <div class="btn-grid">
            <button class="btn btn-teguran" onclick="addPenalty('red', 'teguran', 1)">Teguran 1 (-1)</button>
            <button class="btn btn-teguran" onclick="addPenalty('red', 'teguran', 2)">Teguran 2 (-2)</button>
          </div>
        </div>

        <div class="penalty-group">
          <div class="penalty-title">PERINGATAN</div>
          <div class="btn-grid">
            <button class="btn btn-peringatan" onclick="addPenalty('red', 'peringatan', 1)">Peringatan 1</button>
            <button class="btn btn-peringatan" onclick="addPenalty('red', 'peringatan', 2)">Peringatan 2</button>
          </div>
        </div>

        <div class="penalty-group">
          <div class="penalty-title">PENALTI / AMARAN</div>
          <div class="btn-grid">
            <button class="btn btn-penalti" onclick="addPenalty('red', 'amaran', 1)">Amaran 1 (-5)</button>
            <button class="btn btn-penalti" onclick="addPenalty('red', 'amaran', 2)">Amaran 2 (-10)</button>
            <button class="btn btn-penalti" style="grid-column: span 2; background:#880000;" onclick="addPenalty('red', 'disqualify', 0)">DISQUALIFY (DQ)</button>
          </div>
        </div>

        <button class="btn btn-undo" onclick="undoPenalty('red')">↩ BATAL HUKUMAN TERAKHIR (MERAH)</button>
      </div>

      <!-- SUDUT BIRU -->
      <div class="corner-box">
        <div class="corner-header blue-header">SUDUT BIRU</div>
        
        <div class="penalty-group">
          <div class="penalty-title">TEGURAN</div>
          <div class="btn-grid">
            <button class="btn btn-teguran" onclick="addPenalty('blue', 'teguran', 1)">Teguran 1 (-1)</button>
            <button class="btn btn-teguran" onclick="addPenalty('blue', 'teguran', 2)">Teguran 2 (-2)</button>
          </div>
        </div>

        <div class="penalty-group">
          <div class="penalty-title">PERINGATAN</div>
          <div class="btn-grid">
            <button class="btn btn-peringatan" onclick="addPenalty('blue', 'peringatan', 1)">Peringatan 1</button>
            <button class="btn btn-peringatan" onclick="addPenalty('blue', 'peringatan', 2)">Peringatan 2</button>
          </div>
        </div>

        <div class="penalty-group">
          <div class="penalty-title">PENALTI / AMARAN</div>
          <div class="btn-grid">
            <button class="btn btn-penalti" onclick="addPenalty('blue', 'amaran', 1)">Amaran 1 (-5)</button>
            <button class="btn btn-penalti" onclick="addPenalty('blue', 'amaran', 2)">Amaran 2 (-10)</button>
            <button class="btn btn-penalti" style="grid-column: span 2; background:#880000;" onclick="addPenalty('blue', 'disqualify', 0)">DISQUALIFY (DQ)</button>
          </div>
        </div>

        <button class="btn btn-undo" onclick="undoPenalty('blue')">↩ BATAL HUKUMAN TERAKHIR (BIRU)</button>
      </div>

    </div>
  </div>

  <!-- OVERLAY JIKA PERLAWANAN DIBEKUKAN / DIJEDA OLEH DEWAN -->
  <div id="pengadilOverlay" class="overlay" style="display: none;">
    <div class="overlay-text">PERLAWANAN DIJEDA / TAMAT</div>
  </div>

  <!-- POPUP MODAL TAMAT PUSINGAN / AKHIR -->
  <div id="roundModal" class="overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">PUSINGAN TAMAT</div>
      <div class="modal-body" id="modalBody">
        Masa bagi pusingan ini telah tamat. Sila pilih tindakan seterusnya.
      </div>
      <div class="modal-actions" id="modalActions">
        <!-- Butang dinamik dimasukkan via JS -->
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    let currentRound = 1;
    let hasPoppedForRound = false; 

    // Menerima kemas kini keadaan perlawanan daripada Server
    socket.on('updateState', (state) => {
      currentRound = state.currentRound;

      // 1. Kemas kini Pemasa (Timer)
      const timerElem = document.getElementById('timerDisplay');
      const minutes = Math.floor(state.timer.seconds / 60);
      const seconds = state.timer.seconds % 60;
      timerElem.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      if (state.timer.isRunning) {
        timerElem.classList.remove('paused');
        document.getElementById('pengadilOverlay').style.display = 'none';
      } else {
        timerElem.classList.add('paused');
      }

      // Reset bendera popup jika masa diset semula ke asal (>0s)
      if (state.timer.seconds > 0) {
        hasPoppedForRound = false;
      }

      // Semak jika pusingan tamat (Masa = 0 dan tidak berjalan)
      if (state.timer.seconds === 0 && !state.timer.isRunning && !hasPoppedForRound) {
        hasPoppedForRound = true;
        showRoundEndModal(state);
      }

      // 2. Kemas kini Butang Pusingan
      document.getElementById('roundDisplay').innerText = `PUSINGAN ${state.currentRound}`;
      for (let i = 1; i <= 3; i++) {
        const btn = document.getElementById(`btnR${i}`);
        if (i === state.currentRound) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    });

    // KAWALAN MASA
    function controlTimer(action) {
      socket.emit('controlTimer', { action });
    }

    // TUKAR PUSINGAN
    function setRound(roundNum) {
      hasPoppedForRound = false;
      socket.emit('setRound', { round: roundNum });
    }

    // TAMBAH HUKUMAN / PENALTI
    function addPenalty(corner, type, value) {
      if (confirm(`Sahkan penambahan hukuman ${type.toUpperCase()} kepada SUDUT ${corner.toUpperCase()}?`)) {
        socket.emit('addPenalty', { corner, type, value, round: currentRound });
      }
    }

    // BATAL HUKUMAN (UNDO)
    function undoPenalty(corner) {
      socket.emit('undoPenalty', { corner, round: currentRound });
    }

    // PAPAR MODAL APABILA MASA TAMAT
    function showRoundEndModal(state) {
      const modal = document.getElementById('roundModal');
      const title = document.getElementById('modalTitle');
      const body = document.getElementById('modalBody');
      const popActions = document.getElementById('modalActions');

      modal.style.display = 'flex';

      if (currentRound < 3) {
        title.innerText = `PUSINGAN ${currentRound} TAMAT`;
        body.innerText = `Sila bersedia untuk melangkah ke Pusingan ${currentRound + 1}.`;
        
        popActions.innerHTML = `
          <button class="btn btn-start" style="padding: 14px;" onclick="nextRoundFromModal(${currentRound + 1})">➡️ MASUK PUSINGAN ${currentRound + 1}</button>
          <button class="btn btn-undo" style="padding: 10px;" onclick="closeModal()">TUTUP WINDOW</button>
        `;
      } else {
        title.innerText = `PERLAWANAN TAMAT!`;
        body.innerText = `Pusingan 3 telah selesai. Anda boleh mempamerkan keputusan pemenang ke skrin TV Utama.`;
        
        popActions.innerHTML = `
          <button class="btn btn-success" style="padding: 14px; font-size: 1.1rem; background:#198754;" onclick="publishWinnerFromModal()">🏆 PAMERKAN KEPUTUSAN PEMENANG</button>
          <button class="btn btn-undo" style="padding: 10px;" onclick="closeModal()">TUTUP WINDOW</button>
        `;
      }
    }

    function closeModal() {
      document.getElementById('roundModal').style.display = 'none';
    }

    function nextRoundFromModal(nextR) {
      closeModal();
      setRound(nextR);
      controlTimer('reset');
    }

    function publishWinnerFromModal() {
      closeModal();
      socket.emit('publishWinner');
    }

    function resetMatchModal() {
      if (confirm("ADAKAH ANDA PASTI? Ini akan memadam semua markah dan hukuman untuk perlawanan ini!")) {
        socket.emit('resetMatch');
      }
    }

    // Status Sambungan Socket
    socket.on('connect', () => {
      document.getElementById('connectionStatus').innerText = "● BERSAMBUNG";
      document.getElementById('connectionStatus').style.color = "#28a745";
    });

    socket.on('disconnect', () => {
      document.getElementById('connectionStatus').innerText = "● TERPUTUS";
      document.getElementById('connectionStatus').style.color = "#dc3545";
    });
  </script>
</body>
</html>
