<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Controller Juri Silat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Arial', sans-serif; user-select: none; }
    body { background: #111; color: white; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; gap: 10px; }
    
    .juri-select { display: flex; align-items: center; justify-content: space-between; background: #222; padding: 10px; border-radius: 8px; }
    select { font-size: 1.2rem; padding: 5px; background: #333; color: white; border: none; border-radius: 4px; }
    
    .buttons-container { flex: 1; display: flex; gap: 10px; }
    .corner-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    
    .btn { 
      flex: 1; border: none; border-radius: 12px; font-size: 2rem; font-weight: bold; color: white; 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      cursor: pointer; active { opacity: 0.7; transform: scale(0.98); }
    }
    
    .blue-btn { background: #0080ff; }
    .red-btn { background: #d32f2f; }
    .btn-label { font-size: 1rem; margin-top: 5px; opacity: 0.8; }
  </style>
</head>
<body>

  <div class="juri-select">
    <label for="juriId">PILIH NO JURI:</label>
    <select id="juriId">
      <option value="1">JURI 1</option>
      <option value="2">JURI 2</option>
      <option value="3">JURI 3</option>
    </select>
  </div>

  <div class="buttons-container">
    <!-- SUDUT BIRU -->
    <div class="corner-col">
      <button class="btn blue-btn" onclick="sendPoint('blue', 1)">
        🥊
        <span class="btn-label">PUKUL (1)</span>
      </button>
      <button class="btn blue-btn" onclick="sendPoint('blue', 2)">
        🦶
        <span class="btn-label">TENDANG (2)</span>
      </button>
    </div>

    <!-- SUDUT MERAH -->
    <div class="corner-col">
      <button class="btn red-btn" onclick="sendPoint('red', 1)">
        🥊
        <span class="btn-label">PUKUL (1)</span>
      </button>
      <button class="btn red-btn" onclick="sendPoint('red', 2)">
        🦶
        <span class="btn-label">TENDANG (2)</span>
      </button>
    </div>
  </div>

  <script>
    const socket = io();

    function sendPoint(color, points) {
      const juriId = document.getElementById('juriId').value;
      
      // Hantar data ke server
      socket.emit('juriPress', {
        juriId: Number(juriId),
        color: color,
        points: Number(points)
      });
    }
  </script>
</body>
</html>
