<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Juri - Silat Olahraga</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      user-select: none;
      -webkit-user-select: none;
    }

    body { 
      background: #0a0c10; 
      color: #fff; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      padding: 10px;
      overflow: hidden;
    }

    /* HEADER PILIHAN ID JURI & STATUS MASA */
    .header-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: #161b22; 
      padding: 8px 12px; 
      border-radius: 8px; 
      border: 1px solid #30363d;
      margin-bottom: 10px;
      height: 50px;
    }

    .juri-selector select { 
      background: #0d1117; 
      color: #f1c40f; 
      border: 1px solid #f1c40f; 
      padding: 6px 10px; 
      font-size: 14px; 
      font-weight: bold; 
      border-radius: 6px; 
      outline: none;
    }

    .status-info { 
      font-size: 14px; 
      font-weight: bold; 
      color: #8b949e; 
    }

    /* LAYOUT UTAMA BUTANG MARKAH */
    .main-container { 
      flex: 1; 
      display: flex; 
      gap: 10px; 
    }

    @media (orientation: portrait) {
      .main-container { flex-direction: column; }
    }

    @media (orientation: landscape) {
      .main-container { flex-direction: row; }
    }

    /* KOTAK SUDUT BIRU & MERAH */
    .corner-panel { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      padding: 10px; 
      border-radius: 12px; 
      justify-content: center;
    }

    .blue-corner { 
      background: rgba(0, 128, 255, 0.08); 
      border: 2px solid #0080ff; 
    }

    .red-corner { 
      background: rgba(211, 47, 47, 0.08); 
      border: 2px solid #d32f2f; 
    }

    .corner-title { 
      text-align: center; 
      font-size: 16px; 
      font-weight: 900; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    }
    .blue-corner .corner-title { color: #3498db; }
    .red-corner .corner-title { color: #e74c3c; }

    /* BUTTON ACTION MARKAH */
    .btn-score-group {
      display: flex;
      gap: 8px;
      flex: 1;
    }

    .btn-score { 
      flex: 1; 
      border: none; 
      border-radius: 10px; 
      font-size: 22px; 
      font-weight: 900; 
      color: #fff; 
      cursor: pointer; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .btn-score:active { 
      transform: scale(0.95); 
      filter: brightness(1.3);
    }

    .btn-score span { 
      font-size: 11px; 
      font-weight: normal; 
      opacity: 0.9; 
      margin-top: 2px;
    }

    .btn-blue-1 { background: #0056b3; }
    .btn-blue-2 { background: #0080ff; }
    .btn-blue-3 { background: #003380; } /* Warna Biru untuk Jatuhan */

    .btn-red-1 { background: #9a0000; }
    .btn-red-2 { background: #d32f2f; }
    .btn-red-3 { background: #660000; } /* Warna Merah untuk Jatuhan */

    /* BUTANG JATUHAN (KHAS) */
    .btn-jatuhan {
      border: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .btn-jatuhan:active {
      transform: scale(0.95);
      filter: brightness(1.3);
    }

    .btn-jatuhan span {
      font-size: 11px;
      font-weight: bold;
      margin-top: 2px;
    }

    /* POPUP OVERLAY VERIFICATION */
    #verifyOverlay { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.92); 
      z-index: 999; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      padding: 15px; 
    }

    .overlay-card {
      background: #161b22;
      border: 3px solid #f1c40f;
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    .overlay-title { font-size: 16px; font-weight: 800; color: #f1c40f; margin-bottom: 5px; }
    .overlay-detail { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 15px; }

    .vote-btn-group { display: flex; gap: 10px; }
    .btn-vote { 
      flex: 1; 
      padding: 15px 5px; 
      font-size: 18px; 
      font-weight: 900; 
      border-radius: 8px; 
      border: none; 
      color: white; 
      cursor: pointer; 
    }
    .btn-sah { background: #2ecc71; }
    .btn-xsah { background: #e74c3c; }
  </style>
</head>
<body>

  <!-- HEADER SELECTOR JURI -->
  <div class="header-bar">
    <div class="juri-selector">
      <label for="juriIdSelect" style="font-size: 12px; color: #8b949e;">PERANAN:</label>
      <select id="juriIdSelect">
        <option value="1">JURI 1</option>
        <option value="2">JURI 2</option>
        <option value="3">JURI 3</option>
      </select>
    </div>
    <div class="status-info" id="matchStatus">R1 | 01:30</div>
  </div>

  <!-- MAIN CONTAINER -->
  <div class="main-container">
    
    <!-- SUDUT BIRU -->
    <div class="corner-panel blue-corner">
      <div class="corner-title">🔵 SUDUT BIRU</div>
      <div class="btn-score-group">
        <button class="btn-score btn-blue-1" onclick="sendScore('blue', 1)">
          👊🏻
          <span>PUKULAN (+1)</span>
        </button>
        <button class="btn-score btn-blue-2" onclick="sendScore('blue', 2)">
          🦶🏻
          <span>TENDANGAN (+2)</span>
        </button>
      </div>
      <!-- BUTANG JATUHAN SUDUT BIRU -->
      <button class="btn-jatuhan btn-blue-3" onclick="sendScore('blue', 3)">
        🤼‍♂️ 
        <span>JATUHAN (+3)</span>
      </button>
    </div>

    <!-- SUDUT MERAH -->
    <div class="corner-panel red-corner">
      <div class="corner-title">🔴 SUDUT MERAH</div>
      <div class="btn-score-group">
        <button class="btn-score btn-red-1" onclick="sendScore('red', 1)">
          👊🏻
          <span>PUKULAN (+1)</span>
        </button>
        <button class="btn-score btn-red-2" onclick="sendScore('red', 2)">
          🦶🏻
          <span>TENDANGAN (+2)</span>
        </button>
      </div>
      <!-- BUTANG JATUHAN SUDUT MERAH -->
      <button class="btn-jatuhan btn-red-3" onclick="sendScore('red', 3)">
        🤼‍♂️ 
        <span>JATUHAN (+3)</span>
      </button>
    </div>

  </div>

  <!-- POPUP SEMAKAN VERIFICATION -->
  <div id="verifyOverlay">
    <div class="overlay-card">
      <div class="overlay-title">⚠️ UNDIAN SEMAKAN JURI ⚠️</div>
      <div class="overlay-detail" id="verifyText">JATUHAN - BIRU</div>
      <div class="vote-btn-group">
        <button class="btn-vote btn-sah" onclick="sendVote(true)">SAH (YES)</button>
        <button class="btn-vote btn-xsah" onclick="sendVote(false)">TAK SAH (NO)</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    socket.on('updateState', (state) => {
      const timeStr = formatTime(state.timer.currentTime);
      document.getElementById('matchStatus').innerText = `ROUND ${state.round} | ${timeStr}`;
    });

    // HANTAR MARKAH & SIGNAL TEKANAN KEPADA SERVER
    function sendScore(color, points) {
      const juriId = document.getElementById('juriIdSelect').value;
      
      // Menggunakan event 'pressScore' & parameter 'points' yang sepadan dengan server.js
      socket.emit('pressScore', { juriId, color, points });
    }

    socket.on('promptVerification', (data) => {
      document.getElementById('verifyText').innerText = `${data.type} - SUDUT ${data.color.toUpperCase()}`;
      document.getElementById('verifyOverlay').style.display = 'flex';
    });

    // HANTAR UNDIAN JURI
    function sendVote(isApproved) {
      const juriId = document.getElementById('juriIdSelect').value;
      
      // Diselaraskan dengan event 'submitVerification' pada server.js
      socket.emit('submitVerification', { juriId, approved: isApproved });
      document.getElementById('verifyOverlay').style.display = 'none';
    }

    socket.on('verificationResult', () => {
      document.getElementById('verifyOverlay').style.display = 'none';
    });
  </script>
</body>
</html>
