<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PANEL JURI - SILAT OLAHRAGA</title>
  
  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root {
      --bg-dark: #121212;
      --red-corner: #dc3545;
      --red-active: #a71d2a;
      --blue-corner: #0d6efd;
      --blue-active: #0b5ed7;
      --yellow-drop: #ffc107;
      --text-light: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* BAR ATAS / HEADER */
    .header-bar {
      background: #000;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
    }

    .juri-select-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .juri-select-container label {
      font-weight: bold;
      color: #ffc107;
      font-size: 1.1rem;
    }

    select {
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 12px;
      font-size: 1rem;
      border-radius: 6px;
      font-weight: bold;
      outline: none;
    }

    .match-info {
      font-size: 1.1rem;
      font-weight: bold;
      background: #222;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #444;
    }

    /* KAWASAN UTAMA PEMARKAHAN (Dua Terbahag) */
    .scoring-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    .corner-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
    }

    .red-side {
      background-color: rgba(220, 53, 69, 0.05);
      border-right: 2px solid #333;
    }

    .blue-side {
      background-color: rgba(13, 110, 253, 0.05);
    }

    /* REKABENTUK BUTANG MARKAH */
    .btn-score {
      flex: 1;
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.05s, filter 0.1s;
    }

    .btn-score:active {
      transform: scale(0.97);
      filter: brightness(1.2);
    }

    /* SKIM WARNA BUTANG MERAH */
    .btn-red-1 { background: linear-gradient(135deg, #e63946, #b71c1c); }
    .btn-red-2 { background: linear-gradient(135deg, #d32f2f, #8e0000); }
    .btn-red-3 { background: linear-gradient(135deg, #ff5252, #c62828); border: 2px solid #ff8080; }

    /* SKIM WARNA BUTANG BIRU */
    .btn-blue-1 { background: linear-gradient(135deg, #1e88e5, #0d47a1); }
    .btn-blue-2 { background: linear-gradient(135deg, #1565c0, #0a2472); }
    .btn-blue-3 { background: linear-gradient(135deg, #42a5f5, #1565c0); border: 2px solid #90caf9; }

    .btn-score span.pts {
      font-size: 3.5rem;
      line-height: 1;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }

    .btn-score span.lbl {
      font-size: 1.2rem;
      margin-top: 5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* BUTANG KHAS JATUHAN (+3) */
    .btn-jatuhan {
      flex: 0.8;
      background: linear-gradient(135deg, #ffb300, #ff6f00);
      color: #000;
      border-radius: 12px;
      border: none;
      font-weight: 900;
      font-size: 1.4rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .btn-jatuhan:active {
      transform: scale(0.97);
      background: #ffc107;
    }

    /* POPUP/INDIKATOR APABILA DITEKAN */
    .feedback-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }
    .feedback-indicator.show {
      opacity: 1;
      transform: translate(-50%, -60%) scale(1.2);
    }

    /* SKRIN DISEKAT/LOCKED JIKA PEMASA BERHENTI */
    .disabled-overlay {
      position: absolute;
      top: 60px; left: 0; width: 100%; height: calc(100vh - 60px);
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99;
      color: #ff3333;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
    }

    @media (max-height: 500px) {
      .btn-score span.pts { font-size: 2.2rem; }
      .btn-score span.lbl { font-size: 0.9rem; }
      .btn-jatuhan { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <!-- BAR ATAS -->
  <div class="header-bar">
    <div class="juri-select-container">
      <label for="juriIdSelect">IDENTITI:</label>
      <select id="juriIdSelect" onchange="changeJuriId()">
        <option value="1">JURI 1</option>
        <option value="2">JURI 2</option>
        <option value="3">JURI 3</option>
      </select>
    </div>

    <div class="match-info" id="roundDisplay">
      PUSINGAN: -
    </div>
  </div>

  <!-- KAWASAN TUKAR MARKAH -->
  <div class="scoring-container">
    
    <!-- BAHAGIAN SUDUT MERAH -->
    <div class="corner-side red-side">
      
      <!-- PUKULAN (+1) -->
      <button class="btn-score btn-red-1" onclick="sendScore('red', 1)">
        <span class="pts">+1</span>
        <span class="lbl">PUKULAN</span>
      </button>

      <!-- TENDANGAN (+2) -->
      <button class="btn-score btn-red-2" onclick="sendScore('red', 2)">
        <span class="pts">+2</span>
        <span class="lbl">TENDANGAN</span>
      </button>

      <!-- BUTANG JATUHAN SUDUT MERAH -->
      <button class="btn-score btn-red-3" onclick="sendScore('red', 3)">
        <span class="pts">+3</span>
        <span class="lbl">JATUHAN</span>
      </button>

    </div>

    <!-- BAHAGIAN SUDUT BIRU -->
    <div class="corner-side blue-side">
      
      <!-- PUKULAN (+1) -->
      <button class="btn-score btn-blue-1" onclick="sendScore('blue', 1)">
        <span class="pts">+1</span>
        <span class="lbl">PUKULAN</span>
      </button>

      <!-- TENDANGAN (+2) -->
      <button class="btn-score btn-blue-2" onclick="sendScore('blue', 2)">
        <span class="pts">+2</span>
        <span class="lbl">TENDANGAN</span>
      </button>

      <!-- BUTANG JATUHAN SUDUT BIRU -->
      <button class="btn-score btn-blue-3" onclick="sendScore('blue', 3)">
        <span class="pts">+3</span>
        <span class="lbl">JATUHAN</span>
      </button>

    </div>

  </div>

  <!-- INDIKATOR MAKLUM BALAS KETIKAN -->
  <div id="feedback" class="feedback-indicator">+1</div>

  <!-- OVERLAY SKRIN DIKUNCI -->
  <div id="lockOverlay" class="disabled-overlay" style="display: none;">
    MASA DIJEDA / PERLAWANAN TAMAT
  </div>

  <script>
    const socket = io();

    // Menyimpan identiti Juri tempatan
    let currentJuriId = localStorage.getItem('silat_juri_id') || "1";
    document.getElementById('juriIdSelect').value = currentJuriId;

    let isCooldown = false; // Mencegah spam/double-click

    function changeJuriId() {
      currentJuriId = document.getElementById('juriIdSelect').value;
      localStorage.setItem('silat_juri_id', currentJuriId);
    }

    // MENGHANTAR MARKAH KE SERVER
    function sendScore(color, points) {
      if (isCooldown) return; // Sekat jika ketukan terlalu laju

      isCooldown = true;
      setTimeout(() => { isCooldown = false; }, 300); // Debounce 300ms

      const payload = {
        juriId: parseInt(currentJuriId),
        corner: color,
        points: points,
        timestamp: Date.now()
      };

      socket.emit('submitScore', payload);
      triggerFeedback(color, points);
    }

    // PENUNJUK VISUAL SELEPAS MENEKAN BUTANG
    function triggerFeedback(color, points) {
      const fb = document.getElementById('feedback');
      fb.innerText = `+${points}`;
      fb.style.color = color === 'red' ? '#ff4d4d' : '#4d94ff';
      
      fb.classList.add('show');
      setTimeout(() => {
        fb.classList.remove('show');
      }, 300);
    }

    // MENERIMA KEMAS KINI KEADAAN DARIPADA SERVER
    socket.on('updateState', (state) => {
      // Kemas kini paparan Pusingan
      document.getElementById('roundDisplay').innerText = `PUSINGAN: ${state.currentRound}`;

      // Kunci skrin jika pemasa tidak berjalan (paused/tamat)
      const lockOverlay = document.getElementById('lockOverlay');
      if (!state.timer.isRunning) {
        lockOverlay.style.display = 'flex';
      } else {
        lockOverlay.style.display = 'none';
      }
    });

    // ISYARAT DARI SERVER
    socket.on('connect', () => {
      console.log("Terhubung ke Server Pemarkahan.");
    });
  </script>
</body>
</html>
